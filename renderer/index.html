<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyuch</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-locked>

<header id="top">
  <div class="menuwrap">
    <button id="brandBtn" class="brandbtn" aria-haspopup="menu" aria-expanded="false" title="Menu"><span id="brand" class="brand logoword" role="img" aria-label="Kyuch"></span></button>
    <div id="logoMenu" class="popmenu" role="menu" hidden>
      <button id="mNew" role="menuitem">New database…</button>
      <button id="mOpen" role="menuitem">Open database…</button>
      <hr class="sep needs-db">
      <button id="mLock" role="menuitem" class="needs-db">Lock</button>
      <button id="mClose" role="menuitem" class="needs-db">Close database</button>
      <hr class="sep">
      <button id="mSettings" role="menuitem">Settings</button>
      <button id="mAbout" role="menuitem">About</button>
      <hr class="sep">
      <button id="mQuit" role="menuitem">Quit Kyuch</button>
    </div>
  </div>
  <div id="tools">
    <div class="menuwrap needs-db">
      <button id="btnAdd" aria-haspopup="menu" aria-expanded="false">Add ▾</button>
      <div id="addMenu" class="popmenu" role="menu" hidden>
        <button id="addEntry" role="menuitem">Entry</button>
        <button id="addFolder" role="menuitem">Folder</button>
      </div>
    </div>
    <button id="btnSave" class="needs-db" title="Save (Ctrl+S)">Save</button>
    <button id="btnLock" class="needs-db" title="Lock (Ctrl+L)">Lock</button>
    <button id="btnGen" class="needs-db" title="Password generator">Generator</button>
    <button id="btnSettings" title="Settings">Settings</button>
    <button id="btnAbout" title="About Kyuch">About</button>
  </div>
  <input id="search" class="needs-db" type="search" placeholder="Search (Ctrl+F)" hidden>
  <div id="winctl">
    <button id="wMin" title="Minimize" aria-label="Minimize"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6h7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button id="wMax" title="Maximize" aria-label="Maximize"><svg class="max" width="12" height="12" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><svg class="rest" width="12" height="12" viewBox="0 0 12 12" hidden><rect x="2" y="4" width="5.8" height="5.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.4 3.6V3.4A1.4 1.4 0 0 1 5.8 2h2.8A1.4 1.4 0 0 1 10 3.4v2.8a1.4 1.4 0 0 1-1.4 1.4h-.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button id="wClose" title="Close" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>
</header>

<main id="lock" hidden>
  <div class="card">
    <span class="mark logomark" role="img" aria-label=""></span><span class="word logoword" role="img" aria-label="Kyuch"></span>
    <div id="recent"></div>
    <form id="unlockForm" hidden>
      <div class="muted" id="unlockPath"></div>
      <input id="unlockPw" type="password" placeholder="Master password" autocomplete="off" required>
      <button class="primary">Unlock</button>
    </form>
    <div class="row">
      <button id="btnNewDb">New database…</button>
      <button id="btnOpenDb">Open file…</button>
    </div>
    <p class="error" id="lockErr"></p>
  </div>
</main>

<div id="app" hidden>
  <div id="panes">
    <nav id="tree" role="tree" aria-label="Folders"></nav>
    <section id="list"></section>
    <aside id="detail"></aside>
  </div>
  <footer id="status"></footer>
</div>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <div class="muted" id="dbInfo" hidden></div>
    <label>Auto-lock after idle minutes (0 = never) <input id="aLock" type="number" min="0"></label>
    <label>Alt+Tab delay (milliseconds to wait before auto-type presses Alt+Tab) <input id="aDelay" type="number" min="0" max="10000" step="50"></label>
    <label class="check"><input type="checkbox" id="aAutoUpd"> Check for updates once a day when Kyuch starts</label>
    <label class="check"><input type="checkbox" id="aTray"> Minimize to the system tray when the window is closed (otherwise Kyuch quits)</label>
    <label class="check"><input type="checkbox" id="aTrayLock"> Lock the database when it goes to the tray</label>
    <label>Open links from entries in <select id="aBrowser"></select></label>
    <div class="muted">Theme</div>
    <div id="aThemes" class="themes" role="radiogroup" aria-label="Theme"></div>
    <fieldset id="aAccessBox" hidden>
      <legend>Auto-type permission (Linux)</legend>
      <small class="muted" id="aAccessText"></small>
      <div class="row"><button type="button" id="aAccessBtn"></button></div>
    </fieldset>
    <label id="aLayoutWrap">Keyboard layout for auto-type <select id="aLayout"><option value="auto">Detect automatically (GNOME)</option><option value="us">US</option><option value="gb">UK (GB)</option></select></label>
    <div id="aPwBox" class="stack">
    <label>Change master password <input id="aNewPw" type="password" autocomplete="off" placeholder="New master password (leave empty to keep)"></label>
    <label>Repeat the new master password <input id="aNewPw2" type="password" autocomplete="off"></label>
    <p class="error" id="aErr"></p>
    </div>
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Apply</button></menu>
  </form>
</dialog>

<dialog id="aboutDlg">
  <form method="dialog" id="aboutForm">
    <div class="about">
      <span class="mark logomark" role="img" aria-label=""></span><span class="word logoword" role="img" aria-label="Kyuch"></span>
      <div id="aboutVersion">Version</div>
      <div class="muted">Made by NoSwear32</div>
      <div id="updStatus" class="muted" role="status"></div>
      <pre id="updNotes" hidden></pre>
      <progress id="updBar" max="1" value="0" hidden></progress>
      <small id="updPct" class="muted" hidden></small>
      <div class="row center">
        <button type="button" id="updCheck">Check for updates</button>
        <button type="button" id="updInstall" class="primary" hidden>Download and install</button>
        <button type="button" id="updCancel" class="cancelbtn" hidden>Cancel</button>
        <button type="button" id="updRestart" class="primary" hidden>Restart now</button>
      </div>
    </div>
    <menu><button value="cancel" formnovalidate>Close</button></menu>
  </form>
</dialog>

<dialog id="newDbDlg">
  <form method="dialog" id="newDbForm">
    <h2>New database</h2>
    <div class="muted" id="newDbPath"></div>
    <label>Master password <input id="nPw" type="password" autocomplete="off" required></label>
    <label>Repeat master password <input id="nPw2" type="password" autocomplete="off" required></label>
    <p class="error" id="newDbErr"></p>
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Create</button></menu>
  </form>
</dialog>

<button id="themeBtn" title="Toggle dark / light mode"></button>
<div id="toast" hidden></div>
<script src="themes.js"></script>
<script src="icons.js"></script>
<script src="gen.js"></script>
<script src="common.js"></script>
<script src="generator.js"></script>
<script src="app.js"></script>
</body>
</html>
