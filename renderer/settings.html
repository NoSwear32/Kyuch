<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyuch</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="editor">

<header id="edTop">
  <span class="edtitle">Settings</span>
  <button id="edX" class="xbtn" title="Close (Esc)" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
</header>

<main id="edMain">
  <form id="settingsForm" class="edform">
    <div class="muted" id="dbInfo" hidden></div>
    <label>Auto-lock after idle minutes (0 = never) <input id="aLock" type="number" min="0"></label>
    <label>Alt+Tab delay (milliseconds to wait before auto-type presses Alt+Tab) <input id="aDelay" type="number" min="0" max="10000" step="50"></label>
    <label class="check"><input type="checkbox" id="aAutoUpd"> Check for updates once a day when Kyuch starts</label>
    <label class="check"><input type="checkbox" id="aTray"> Minimize to the system tray when the window is closed (otherwise Kyuch quits)</label>
    <label class="check"><input type="checkbox" id="aTrayLock"> Lock the database when it goes to the tray</label>
    <label class="check"><input type="checkbox" id="aConfirmRm"> Ask before removing a database from the list</label>
    <label>Open links from entries in <select id="aBrowser"></select></label>
    <div class="muted">Theme</div>
    <div id="aThemes" class="themes" role="radiogroup" aria-label="Theme"></div>
    <fieldset id="aAccessBox" hidden>
      <legend>Auto-type permission (Linux)</legend>
      <small class="muted" id="aAccessText"></small>
      <div class="row"><button type="button" id="aAccessBtn"></button></div>
    </fieldset>
    <label id="aLayoutWrap">Keyboard layout for auto-type <select id="aLayout"><option value="auto">Detect automatically (GNOME)</option><option value="us">US</option><option value="gb">UK (GB)</option></select></label>
    <div id="aPwBox" class="stack">
      <label>Change master password <input id="aNewPw" type="password" autocomplete="off" placeholder="New master password (leave empty to keep)"></label>
      <label>Repeat the new master password <input id="aNewPw2" type="password" autocomplete="off"></label>
    </div>
  </form>
</main>

<footer id="edFoot">
  <p class="error" id="aErr" role="alert"></p>
  <div class="edbar"><button type="button" id="edCancel">Cancel</button><button type="submit" id="edSave" form="settingsForm" class="primary">Apply</button></div>
</footer>

<div id="toast" hidden></div>
<script src="themes.js"></script>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
